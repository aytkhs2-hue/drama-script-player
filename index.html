<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Brave English</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:28px 20px 22px;text-align:center}h1{margin:0;font-size:28px}header p{margin:8px 0 0;opacity:.8}main{max-width:680px;margin:auto;padding:18px}.card{background:white;border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 4px 16px #0000000d}button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:10px;font-size:16px;font-weight:700;background:#111827;color:white}button.secondary{background:#e5e7eb;color:#111827}.word{font-size:34px;font-weight:800;text-align:center;margin:15px 0}.meaning{text-align:center;font-size:20px;color:#4b5563}.example{margin-top:18px;padding:15px;background:#f9fafb;border-radius:12px;line-height:1.6}.small{font-size:13px;color:#6b7280;text-align:center}</style></head><body><header><h1>Brave English</h1><p>あなた専用の英語学習アプリ</p></header><main><section class="card"><div class="small">今日の単語</div><div id="word" class="word"></div><div id="meaning" class="meaning"></div><div id="example" class="example"></div><button onclick="nextWord()">次の単語</button><button class="secondary" onclick="speak()">🔊 発音を聞く</button></section><section class="card"><h2>使い方</h2><p>「次の単語」で学習できます。発音ボタンを押すと英語の音声が流れます。</p><p class="small">ホーム画面に追加すると、普通のアプリのように使えます。</p></section></main><script>const words=[["brave","勇敢な","She was brave enough to try something new."],["improve","改善する","I want to improve my English."],["challenge","挑戦","This is a new challenge for me."],["confident","自信のある","I feel more confident when I practice."],["opportunity","機会","This is a great opportunity to learn."]];let i=Math.floor(Math.random()*words.length);function show(){word.textContent=words[i][0];meaning.textContent=words[i][1];example.textContent=words[i][2]}function nextWord(){i=(i+1)%words.length;show()}function speak(){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(words[i][0]))}show();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script></body></html>
